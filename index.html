<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rafaela Marzano · Links</title>
<meta name="description" content="Rafaela Marzano — UGC & nano creator. WhatsApp, portfólio, Instagram, TikTok e e-mail.">
<meta name="theme-color" content="#ff2d87">

<!--
  ============================================================================
  LINK IN BIO — RAFAELA MARZANO (estética Y2K/pink, igual ao portfólio)
  ============================================================================
  Arquivo único (HTML + CSS + JS), sem libs externas além do Google Fonts.

  COMO EDITAR:
  - Os links ficam no array LINKS, dentro do <script> no final do arquivo.
    Troque "url", "titulo", "sub" ou "cor" ali — o resto é renderizado
    automaticamente.
  - Paleta, fontes e efeitos (sticker, glossy, doodles) são os mesmos
    tokens usados no portfólio, pra manter a mesma cara.
  ============================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Caveat:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">

<style>
:root{
  --pink-pale:   #ffe9f3;
  --pink-paper:  #fff3f9;
  --pink:        #ff6fb0;
  --pink-hot:    #ff2d87;
  --pink-deep:   #d4006b;
  --black:       #18130f;
  --white:       #fffaf6;
  --yellow:      #ffe066;
  --blue:        #c9f2ff;
  --shadow-hard: 4px 4px 0 var(--black);
  --shadow-hard-sm: 2.5px 2.5px 0 var(--black);
  --f-display: 'Anton', sans-serif;
  --f-label:   'Bebas Neue', sans-serif;
  --f-hand:    'Permanent Marker', cursive;
  --f-script:  'Caveat', cursive;
}

*,*::before,*::after{ box-sizing:border-box; }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

html{ scroll-behavior:smooth; }

body{
  margin:0; min-height:100vh; min-height:100dvh;
  background:
    radial-gradient(ellipse 60% 35% at 10% 5%, rgba(255,111,176,.35), transparent 60%),
    radial-gradient(ellipse 50% 30% at 95% 15%, rgba(255,45,135,.22), transparent 60%),
    var(--pink-pale);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(24,19,15,.05) 1px, transparent 0),
    radial-gradient(ellipse 60% 35% at 10% 5%, rgba(255,111,176,.35), transparent 60%),
    radial-gradient(ellipse 50% 30% at 95% 15%, rgba(255,45,135,.22), transparent 60%);
  background-size:14px 14px, auto, auto;
  color:var(--black);
  font-family:var(--f-script);
  -webkit-font-smoothing:antialiased;
  display:flex; justify-content:center;
  padding:48px 18px 60px;
  position:relative;
  overflow-x:hidden;
}

a{ color:inherit; text-decoration:none; }
::selection{ background:var(--pink-hot); color:var(--white); }

/* doodles flutuantes de fundo */
.doodle{ position:fixed; pointer-events:none; filter:drop-shadow(2px 2px 0 rgba(0,0,0,.15)); z-index:0; }
.float-a{ animation:floatA 6s ease-in-out infinite; }
.float-b{ animation:floatB 7s ease-in-out infinite; }
.spin-slow{ animation:spinSlow 14s linear infinite; }
@keyframes floatA{ 0%,100%{ transform:translateY(0) rotate(var(--r,0deg)); } 50%{ transform:translateY(-12px) rotate(var(--r,0deg)); } }
@keyframes floatB{ 0%,100%{ transform:translateY(0) rotate(-6deg); } 50%{ transform:translateY(10px) rotate(6deg); } }
@keyframes spinSlow{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
@media (max-width:640px){ .doodle.hide-mobile{ display:none; } }

.page{
  position:relative; z-index:1;
  width:100%; max-width:420px;
  display:flex; flex-direction:column; align-items:center; gap:18px;
}

/* nome recortado de revista, igual ao hero do portfólio */
.name{ text-align:center; margin:6px 0 0; }
.name .row{ display:flex; justify-content:center; flex-wrap:wrap; gap:.02em; }
.lt{
  display:inline-block; line-height:.85;
  font-size:clamp(1.7rem, 11vw, 2.9rem);
  filter:drop-shadow(2.5px 2.5px 0 rgba(0,0,0,.9));
  padding:0 .02em;
}
.lt-1{ font-family:var(--f-display); color:var(--pink-hot); transform:rotate(-6deg); }
.lt-2{ font-family:var(--f-display); color:var(--black); transform:rotate(4deg); }
.lt-3{ font-family:var(--f-display); color:var(--white); -webkit-text-stroke:2.5px var(--black); transform:rotate(-3deg); }
.lt-4{ font-family:var(--f-label); color:var(--pink-deep); transform:rotate(7deg); }
.lt-5{ font-family:var(--f-display); color:var(--pink-deep); transform:rotate(-8deg); }
.lt-6{ font-family:var(--f-display); color:var(--black); transform:rotate(5deg); }
.lt-7{ font-family:var(--f-label); color:var(--pink-hot); transform:rotate(-4deg); }
.lt-8{ font-family:var(--f-display); color:var(--white); -webkit-text-stroke:2.5px var(--pink-deep); transform:rotate(6deg); }

.handle{
  font-family:var(--f-hand); color:var(--pink-deep);
  background:var(--white); border:2.5px solid var(--black);
  padding:6px 14px; border-radius:999px; box-shadow:var(--shadow-hard-sm);
  transform:rotate(-3deg); font-size:.85rem;
}

.badge-dashed{
  font-family:var(--f-label); letter-spacing:.08em; font-size:.78rem;
  color:var(--pink-hot); background:var(--pink-pale);
  border:2px dashed var(--pink-hot); border-radius:999px;
  padding:8px 18px; transform:rotate(-1.5deg);
}

.tagline{
  text-align:center; font-family:var(--f-script); font-weight:700;
  font-size:1.05rem; color:var(--black); max-width:320px;
  background:var(--yellow); display:table; margin:2px auto 0; padding:6px 16px;
  transform:rotate(1deg); box-shadow:var(--shadow-hard-sm); border:2px solid var(--black);
}

/* avatar em polaroide (opcional — troque o .ph por <img> quando tiver a foto) */
.avatar-wrap{ margin-top:2px; }

.polaroid{
  background:var(--white); padding:10px 10px 34px; border:1.5px solid rgba(0,0,0,.15);
  box-shadow:0 12px 24px -12px rgba(0,0,0,.4), var(--shadow-hard-sm);
  width:150px; transform:rotate(-3deg); position:relative;
}
.ph{
  position:relative; width:100%; aspect-ratio:4/5; overflow:hidden;
  display:flex; align-items:center; justify-content:center; text-align:center;
  background:linear-gradient(135deg,#ffd1e8 0%, #ff9ecb 45%, #ff5fa2 100%);
  font-family:var(--f-label); font-size:.68rem; letter-spacing:.04em; padding:10px;
}
.ph::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(115deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 28%, rgba(255,255,255,0) 60%, rgba(255,255,255,.35) 78%, rgba(255,255,255,0) 100%);
  mix-blend-mode:screen;
}
.ph.ph-real{ padding:0; background:var(--black); }
.ph.ph-real::after{ content:none; }
.ph.ph-real img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 20%; }
.polaroid figcaption{
  position:absolute; bottom:8px; left:0; right:0; text-align:center;
  font-family:var(--f-script); font-weight:700; font-size:.9rem;
}

/* lista de links */
.links{ width:100%; display:flex; flex-direction:column; gap:16px; margin-top:8px; }
.link-card{
  display:flex; align-items:center; gap:16px;
  background:var(--white); border:2.5px solid var(--black); border-radius:20px;
  padding:16px 18px; box-shadow:var(--shadow-hard);
  transition:transform .2s ease, box-shadow .2s ease;
  opacity:0; transform:translateY(14px);
  animation:cardIn .5s ease forwards;
}
@keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }
.link-card:hover{ transform:translateY(-4px) rotate(-1deg); box-shadow:6px 8px 0 var(--pink-hot); }
.link-card:active{ transform:translateY(-1px) rotate(0deg); }

.link-icon{
  flex-shrink:0; width:52px; height:52px; border-radius:16px;
  display:flex; align-items:center; justify-content:center;
  border:2.5px solid var(--black); box-shadow:var(--shadow-hard-sm);
}
.link-icon svg{ width:24px; height:24px; }

.link-body .titulo{
  font-family:var(--f-label); font-size:1.2rem; letter-spacing:.03em;
  text-transform:uppercase; line-height:1.1;
}
.link-body .sub{
  font-family:var(--f-script); font-weight:600; font-size:.98rem; color:#5a4d47; margin-top:2px;
}

.link-card.featured{ background:var(--pink-hot); color:var(--white); }
.link-card.featured .titulo{ color:var(--white); }
.link-card.featured .sub{ color:rgba(255,255,255,.85); }
.link-card.featured .link-icon{ background:var(--white); }
.link-card.featured .link-icon svg{ color:var(--pink-hot); }

.footer-note{
  margin-top:10px; text-align:center; font-family:var(--f-hand);
  font-size:.85rem; color:var(--black); opacity:.75; line-height:1.5;
}
.footer-note b{ color:var(--pink-deep); }
</style>
</head>
<body>

<!-- doodles decorativos espalhados pelo fundo -->
<svg class="doodle float-a" style="top:8%;left:6%;--r:-10deg" width="30" height="30" viewBox="0 0 24 24" fill="var(--pink-hot)"><path d="M12 21s-7.5-4.6-10-9.3C0.4 8 2.4 4 6.4 4c2 0 3.6 1.1 4.6 2.7C12 5.1 13.6 4 15.6 4c4 0 6 4 4.4 7.7C19.5 16.4 12 21 12 21z"/></svg>
<svg class="doodle spin-slow" style="top:14%;right:8%" width="26" height="26" viewBox="0 0 24 24" fill="var(--yellow)" stroke="var(--black)" stroke-width="1"><path d="M12 2l2.4 7.2H22l-6 4.4 2.3 7.2L12 16.4l-6.3 4.4L8 13.6 2 9.2h7.6z"/></svg>
<svg class="doodle float-b hide-mobile" style="bottom:10%;left:8%" width="24" height="24" viewBox="0 0 24 24" fill="var(--black)"><path d="M12 21s-7.5-4.6-10-9.3C0.4 8 2.4 4 6.4 4c2 0 3.6 1.1 4.6 2.7C12 5.1 13.6 4 15.6 4c4 0 6 4 4.4 7.7C19.5 16.4 12 21 12 21z"/></svg>
<svg class="doodle float-a hide-mobile" style="bottom:6%;right:10%;--r:8deg" width="22" height="22" viewBox="0 0 24 24" fill="var(--pink)"><path d="M12 2l2.4 7.2H22l-6 4.4 2.3 7.2L12 16.4l-6.3 4.4L8 13.6 2 9.2h7.6z"/></svg>
<svg class="doodle spin-slow hide-mobile" style="top:45%;right:3%" width="18" height="18" viewBox="0 0 24 24" fill="#c9f2ff" stroke="var(--black)" stroke-width="1"><polygon points="12,2 20,9 12,22 4,9"/></svg>

<div class="page">
  <span class="handle">@rafamarzano</span>

  <h1 class="name">
    <span class="row">
      <span class="lt lt-1">R</span><span class="lt lt-2">A</span><span class="lt lt-3">F</span><span class="lt lt-4">A</span><span class="lt lt-5">E</span><span class="lt lt-6">L</span><span class="lt lt-7">A</span>
    </span>
    <span class="row">
      <span class="lt lt-8">M</span><span class="lt lt-1">A</span><span class="lt lt-2">R</span><span class="lt lt-3">Z</span><span class="lt lt-4">A</span><span class="lt lt-5">N</span><span class="lt lt-6">O</span>
    </span>
  </h1>

  <div class="avatar-wrap">
    <figure class="polaroid">
      <div class="ph ph-real"><img src="imagens/retrato.png" alt="Rafaela Marzano"></div>
      <figcaption>hi, it's me</figcaption>
    </figure>
  </div>

  <span class="badge-dashed">UGC &amp; NANO CREATOR</span>
  <p class="tagline">conteúdo que parece indicação de amiga, não propaganda 💋</p>

  <nav class="links" id="linksList" aria-label="Meus links"></nav>

  <p class="footer-note">feita com <b>♥</b> pra sua marca — <b>vamos criar algo icônico?</b></p>
</div>

<script>
/* ============================================================================
   LINKS — edite aqui: url, título, subtítulo, cor de fundo do ícone e o ícone (svg)
   ============================================================================ */
const ICONES = {
  whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.36A10 10 0 1 0 12 2Zm0 1.8a8.2 8.2 0 0 1 6.98 12.5l-.24.4.7 2.55-2.62-.7-.4.24A8.2 8.2 0 1 1 12 3.8Zm-3.1 3.9c-.2 0-.5.06-.77.36-.26.3-1 .98-1 2.4 0 1.4 1.02 2.76 1.16 2.95.14.2 2 3.2 4.9 4.36 2.4.96 2.9.77 3.42.72.53-.05 1.7-.7 1.94-1.36.24-.67.24-1.24.17-1.36-.07-.13-.26-.2-.53-.34-.28-.14-1.62-.8-1.87-.9-.25-.09-.44-.14-.62.14-.18.28-.7.9-.86 1.08-.16.18-.32.2-.6.07-.28-.14-1.16-.43-2.2-1.37-.82-.73-1.37-1.63-1.53-1.9-.16-.28-.02-.43.12-.57.13-.13.28-.32.42-.48.14-.16.18-.28.28-.46.09-.18.05-.34-.02-.48-.07-.14-.6-1.5-.85-2.05-.22-.5-.44-.5-.62-.5Z"/></svg>',
  portfolio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a13.5 13.5 0 0 1 0 18M12 3a13.5 13.5 0 0 0 0 18"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 2h2.9c.16 1.4.7 2.6 1.6 3.5.9.9 2.1 1.4 3.5 1.6v2.9c-1.5 0-2.9-.4-4.1-1.2v6.6c0 3.5-2.85 6.4-6.4 6.4A6.4 6.4 0 0 1 5.6 15c0-3.5 2.85-6.4 6.4-6.4.4 0 .8.04 1.2.1v3.05a3.2 3.2 0 1 0 2.3 3.07V2Z"/></svg>',
  email: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
};

// EDITE AQUI: seus links, na ordem em que devem aparecer.
const LINKS = [
  {
    icone: "whatsapp",
    titulo: "Me contrate como criadora",
    sub: "Fale comigo no WhatsApp",
    url: "https://wa.me/5531983494752?text=Oi%20Rafa,%20vim%20pela%20sua%20bio%20e%20queria%20conversar%20sobre%20uma%20parceria.",
    destaque: true,
    cor: "var(--pink-hot)",
  },
  {
    icone: "portfolio",
    titulo: "Portfólio",
    sub: "Meus trabalhos e cases",
    url: "https://rafamarzano.github.io/portfolio/",
    cor: "var(--yellow)",
  },
  {
    icone: "instagram",
    titulo: "Instagram",
    sub: "@rafamarzano",
    url: "https://instagram.com/rafamarzano",
    cor: "var(--pink-hot)",
  },
  {
    icone: "tiktok",
    titulo: "TikTok",
    sub: "@rafamarzano",
    url: "https://tiktok.com/@rafamarzano",
    cor: "var(--blue)",
  },
  {
    icone: "email",
    titulo: "E-mail",
    sub: "contato@rafamarzano.online",
    url: "mailto:contato@rafamarzano.online",
    cor: "var(--yellow)",
  },
];

document.getElementById('linksList').innerHTML = LINKS.map((item, i) => {
  const externo = !item.url.startsWith('mailto:');
  const targetAttr = externo ? ' target="_blank" rel="noopener noreferrer"' : '';
  const classe = 'link-card' + (item.destaque ? ' featured' : '');
  const iconBg = item.destaque ? '' : `style="background:${item.cor}"`;
  return `
    <a class="${classe}" href="${item.url}"${targetAttr} style="animation-delay:${i * 0.08}s">
      <span class="link-icon" ${iconBg}>${ICONES[item.icone] || ''}</span>
      <span class="link-body">
        <span class="titulo">${item.titulo}</span>
        <span class="sub">${item.sub}</span>
      </span>
    </a>`;
}).join('');
</script>
</body>
</html>
